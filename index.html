<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازرگانی درویشی</title>
    
    <meta name="theme-color" content="#0a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- متغیرهای رنگ (تم‌ها) --- */
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --text-primary: #f0f4f8;
            --text-muted: #6b7a90;
            --border: #2a3548;
            --danger: #ff6b6b;
            --card-blur: none;
            --bg-pattern-opacity: 1;
        }

        /* تم روز */
        html.light {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --accent: #0ea5e9; /* آبی اسکای */
            --accent-glow: rgba(14, 165, 233, 0.2);
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-blur: none;
            --bg-pattern-opacity: 0.1;
        }

        /* تم شیشه‌ای (Glassmorphism) */
        html.glass {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --bg-secondary: rgba(255, 255, 255, 0.2);
            --bg-card: rgba(255, 255, 255, 0.15);
            --accent: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.4);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
            --border: rgba(255, 255, 255, 0.3);
            --card-blur: blur(20px);
            --bg-pattern-opacity: 0.1;
        }

        /* تم نئون (سایبرپانک) */
        html.neon {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #1a1a1a;
            --accent: #ff00ff; /* صورتی نئون */
            --accent-glow: rgba(255, 0, 255, 0.4);
            --text-primary: #00ffff; /* فیروزه‌ای نئون */
            --text-muted: #bbbbbb;
            --border: #ff00ff;
            --card-blur: none;
        }

        /* تم اقیانوسی */
        html.ocean {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --card-blur: none;
        }

        /* --- استایل‌های پایه --- */
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--bg-primary);
            transition: background 0.5s ease;
        }

        /* پس زمینه متحرک */
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: var(--bg-pattern-opacity);
        }
        .bg-pattern::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }
        .bg-pattern::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }

        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.1;
        }

        .calculator-container {
            position: relative;
            z-index: 10;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* هدر و منوی تنظیمات */
        .header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
            transition: color 0.3s;
        }

        .settings-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .settings-btn:hover { color: var(--accent); border-color: var(--accent); }

        /* پنل انتخاب تم */
        .theme-panel {
            position: absolute;
            top: 50px;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            width: 180px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: var(--card-blur);
        }
        .theme-panel.show { display: flex; }

        .theme-option {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 8px;
            border-radius: 8px;
            text-align: right;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-option:hover { background: var(--accent-glow); }
        .theme-option.active { background: var(--accent-glow); color: var(--accent); font-weight: 700; }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* کارت اصلی */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: var(--card-blur);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: all 0.4s ease;
        }

        /* فیلدهای ورودی */
        .input-group { margin-bottom: 16px; animation: slideIn 0.5s ease-out backwards; }
        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .input-label span { color: var(--text-muted); font-size: 0.875rem; font-weight: 600; }

        .toggle-visibility {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 4px 8px; border-radius: 6px; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 4px; font-size: 0.75rem; font-family: 'Vazirmatn', sans-serif;
        }
        .toggle-visibility:hover { color: var(--accent); background: var(--accent-glow); }

        .input-field {
            width: 100%;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            direction: ltr;
            transition: all 0.3s ease;
            cursor: pointer;
            outline: none;
        }

        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
        .input-field.active { border-color: var(--accent); background: var(--accent-glow); }
        .input-field.hidden-value { -webkit-text-security: disc; text-security: disc; }
        .input-field::placeholder { color: var(--text-muted); opacity: 0.5; }

        /* باکس نتیجه */
        .result-card {
            background: var(--accent-glow);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            animation: slideIn 0.5s ease-out 0.3s backwards;
            position: relative;
            overflow: hidden;
        }
        .result-label { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 8px; }
        .result-value { font-size: 2rem; font-weight: 900; color: var(--accent); line-height: 1.2; transition: all 0.3s ease; text-shadow: 0 0 10px var(--accent-glow); }
        .result-value.updating { transform: scale(1.05); }
        .result-currency { color: var(--text-primary); font-size: 1rem; margin-top: 4px; font-weight: 600; opacity: 0.8; }

        /* کیبورد */
        .keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; animation: slideIn 0.5s ease-out 0.4s backwards; }
        .key {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key:active { transform: scale(0.95); background: var(--accent); color: var(--bg-primary); }
        .key.action { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
        .key.action:active { background: var(--accent); color: white; }
        .key.wide { grid-column: span 2; }

        .active-indicator {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; animation: slideIn 0.5s ease-out 0.35s backwards;
        }
        .indicator-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .indicator-dot.active { background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        @media (max-width: 380px) {
            .card { padding: 16px; }
            .key { padding: 12px; font-size: 1.1rem; }
            .result-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="grid-pattern"></div>

    <main class="calculator-container">
        <header class="header">
            <button class="settings-btn" id="settingsBtn" aria-label="تغییر تم">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <!-- پنل انتخاب تم -->
            <div class="theme-panel" id="themePanel">
                <button class="theme-option active" data-theme="dark">
                    <span class="color-dot" style="background: #0a0f1a;"></span> حالت شب
                </button>
                <button class="theme-option" data-theme="light">
                    <span class="color-dot" style="background: #f0f4f8; border-color: #ccc;"></span> حالت روز
                </button>
                <button class="theme-option" data-theme="glass">
                    <span class="color-dot" style="background: linear-gradient(45deg, #667eea, #f093fb);"></span> حالت شیشه‌ای
                </button>
                <button class="theme-option" data-theme="neon">
                    <span class="color-dot" style="background: #ff00ff;"></span> حالت نئون
                </button>
                <button class="theme-option" data-theme="ocean">
                    <span class="color-dot" style="background: #38bdf8;"></span> حالت اقیانوس
                </button>
            </div>
            <h1>بازرگانی درویشی</h1>
        </header>

        <div class="card">
            <div class="input-group">
                <div class="input-label">
                    <span>کد کالا</span>
                </div>
                <input type="text" id="codeInput" class="input-field" placeholder="کد کالا را وارد کنید" readonly aria-label="کد کالا" inputmode="numeric">
            </div>

            <div class="input-group">
                <div class="input-label">
                    <span>مقدار کالا</span>
                    <button class="toggle-visibility" id="toggleBtn" aria-label="تغییر حالت نمایش مقدار">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <span id="toggleText">مخفی</span>
                    </button>
                </div>
                <input type="text" id="amountInput" class="input-field hidden-value" placeholder="مقدار کالا را وارد کنید" value="44000" readonly aria-label="مقدار کالا" inputmode="decimal">
            </div>

            <div class="result-card">
                <div class="result-label">مجموع محاسبه</div>
                <div class="result-value" id="resultValue">0</div>
                <div class="result-currency">تومان</div>
            </div>

            <div class="active-indicator">
                <div class="indicator-dot active" data-field="code"></div>
                <div class="indicator-dot" data-field="amount"></div>
            </div>

            <div class="keyboard" role="group">
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key action" data-action="delete">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>

                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key action" data-action="clear">C</button>

                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key=".">.</button>

                <button class="key wide" data-key="0">0</button>
                <button class="key action wide" data-action="calculate">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // --- مدیریت تم ---
        const settingsBtn = document.getElementById('settingsBtn');
        const themePanel = document.getElementById('themePanel');
        const themeOptions = document.querySelectorAll('.theme-option');

        // بارگذاری تم ذخیره شده
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            themePanel.classList.toggle('show');
        });

        // بستن پنل با کلیک بیرون
        document.addEventListener('click', (e) => {
            if (!themePanel.contains(e.target) && !settingsBtn.contains(e.target)) {
                themePanel.classList.remove('show');
            }
        });

        themeOptions.forEach(option => {
            option.addEventListener('click', () => {
                const themeName = option.dataset.theme;
                setTheme(themeName);
                themePanel.classList.remove('show');
            });
        });

        function setTheme(themeName) {
            // حذف کلاس‌های تم قبلی
            document.documentElement.classList.remove('dark', 'light', 'glass', 'neon', 'ocean');
            // اعمال تم جدید
            document.documentElement.classList.add(themeName);
            
            // آپدیت دکمه‌ها
            themeOptions.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === themeName);
            });

            // تغییر رنگ Meta Theme Color برای موبایل
            let color = '#0a0f1a';
            if(themeName === 'light') color = '#f0f4f8';
            else if(themeName === 'glass') color = '#764ba2';
            else if(themeName === 'neon') color = '#0d0d0d';
            else if(themeName === 'ocean') color = '#0f172a';
            
            document.querySelector('meta[name="theme-color"]').setAttribute('content', color);

            // ذخیره در حافظه
            localStorage.setItem('theme', themeName);
        }

        // --- منطق ماشین حساب ---
        const codeInput = document.getElementById('codeInput');
        const amountInput = document.getElementById('amountInput');
        const resultValue = document.getElementById('resultValue');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const eyeIcon = document.getElementById('eyeIcon');
        const indicatorDots = document.querySelectorAll('.indicator-dot');
        const keys = document.querySelectorAll('.key');

        let activeField = 'code';
        let isAmountHidden = true;

        function setActiveField(field) {
            activeField = field;
            codeInput.classList.toggle('active', field === 'code');
            amountInput.classList.toggle('active', field === 'amount');
            indicatorDots.forEach(dot => dot.classList.toggle('active', dot.dataset.field === field));
        }

        codeInput.addEventListener('click', () => setActiveField('code'));
        amountInput.addEventListener('click', () => setActiveField('amount'));
        indicatorDots.forEach(dot => dot.addEventListener('click', () => setActiveField(dot.dataset.field)));

        toggleBtn.addEventListener('click', () => {
            isAmountHidden = !isAmountHidden;
            amountInput.classList.toggle('hidden-value', isAmountHidden);
            toggleText.textContent = isAmountHidden ? 'مخفی' : 'نمایش';
            eyeIcon.innerHTML = isAmountHidden 
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        });

        keys.forEach(key => {
            key.addEventListener('click', () => {
                const keyValue = key.dataset.key;
                const action = key.dataset.action;
                const currentInput = activeField === 'code' ? codeInput : amountInput;
                let value = currentInput.value;

                if (keyValue) {
                    if (keyValue === '.' && value.includes('.')) return;
                    currentInput.value = value + keyValue;
                    calculateResult();
                } else if (action) {
                    switch (action) {
                        case 'delete': currentInput.value = value.slice(0, -1); calculateResult(); break;
                        case 'clear': currentInput.value = ''; calculateResult(); break;
                        case 'calculate': calculateResult(); resultValue.classList.add('updating'); setTimeout(() => resultValue.classList.remove('updating'), 300); break;
                    }
                }
            });
        });

        function calculateResult() {
            const code = parseFloat(codeInput.value) || 0;
            const amount = parseFloat(amountInput.value) || 0;
            const result = code * amount;
            resultValue.textContent = result.toLocaleString('fa-IR');
            resultValue.classList.add('updating');
            setTimeout(() => resultValue.classList.remove('updating'), 150);
        }

        document.addEventListener('keydown', (e) => {
            if (/^[0-9.]$/.test(e.key)) {
                const currentInput = activeField === 'code' ? codeInput : amountInput;
                if (e.key === '.' && currentInput.value.includes('.')) return;
                currentInput.value += e.key;
                calculateResult();
            }
            if (e.key === 'Backspace') {
                const currentInput = activeField === 'code' ? codeInput : amountInput;
                currentInput.value = currentInput.value.slice(0, -1);
                calculateResult();
            }
            if (e.key === 'Tab') { e.preventDefault(); setActiveField(activeField === 'code' ? 'amount' : 'code'); }
            if (e.key === 'Enter') { calculateResult(); }
        });

        setActiveField('code');
        calculateResult();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
